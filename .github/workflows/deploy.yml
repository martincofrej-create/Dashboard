# ═══════════════════════════════════════════════════════════
# CI/CD — Auto-deploy to Google Cloud Run on push to main
# ═══════════════════════════════════════════════════════════
#
# Requisitos: Configurar estos secrets en GitHub:
#   - GCP_PROJECT_ID      → ID de tu proyecto en Google Cloud
#   - GCP_SA_KEY          → JSON key de una Service Account con permisos de Cloud Run
#
name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  SERVICE_NAME: klassik-dashboard
  REGION: us-central1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.SERVICE_NAME }} \
            --platform managed \
            --region ${{ env.REGION }} \
            --port 8080 \
            --memory 256Mi \
            --allow-unauthenticated

      - name: Show service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "🌐 Dashboard URL: ${URL}"
